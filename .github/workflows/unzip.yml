name: Unzip file
on: workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip ten-file.zip -d .
          rm ten-file.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Giải nén tool"
          git push
